<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0b1120" />
  <title>Bayesian Keiba AI — Neon Edition</title>
  <style>
    :root {
      --bg: #0b1120;
      --surface: #111827;
      --surface-2: #1e293b;
      --border: rgba(148, 163, 184, 0.2);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --emerald: #10b981;
      --amber: #f59e0b;
      --rose: #f43f5e;
      --indigo: #818cf8;
      --radius: 14px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      font-size: 14px;
      line-height: 1.5;
      overflow-x: hidden;
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(11, 17, 32, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: calc(env(safe-area-inset-top, 0px) + 10px) 14px 10px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .app-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .neon-pill {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      color: #fff;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .kpi-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 8px;
    }

    .kpi-box {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 6px;
      text-align: center;
    }

    .kpi-box span {
      display: block;
      font-size: 10px;
      color: var(--muted);
    }

    .kpi-box strong {
      font-size: 13px;
      font-weight: 800;
    }

    .tab-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 10px;
    }

    .tab-btn {
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 7px 4px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tab-btn.active {
      background: rgba(56, 189, 248, 0.18);
      color: var(--accent);
      border-color: rgba(56, 189, 248, 0.6);
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 12px 12px calc(env(safe-area-inset-bottom, 0px) + 32px);
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
      align-items: center;
      justify-content: space-between;
    }

    .filter-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
    }

    .chip.active {
      background: var(--accent);
      color: #0b1120;
      border-color: var(--accent);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 13px;
      margin-bottom: 14px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 8px;
    }

    .race-title {
      font-size: 15px;
      font-weight: 800;
      margin: 0;
    }

    .race-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .rank-badge {
      font-size: 11px;
      font-weight: 800;
      padding: 4px 9px;
      border-radius: 8px;
      white-space: nowrap;
    }

    .rank-S { background: rgba(244, 63, 94, 0.22); color: #fb7185; border: 1px solid rgba(244, 63, 94, 0.5); }
    .rank-A { background: rgba(16, 185, 129, 0.22); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.5); }
    .rank-B { background: rgba(56, 189, 248, 0.2); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.45); }
    .rank-New { background: rgba(168, 85, 247, 0.22); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.5); }
    .rank-Pass { background: rgba(148, 163, 184, 0.16); color: #94a3b8; border: 1px solid var(--border); }

    .neon-meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin: 6px 0 8px;
    }

    .badge {
      font-size: 10.5px;
      padding: 2px 7px;
      border-radius: 999px;
      font-weight: 700;
      background: rgba(148, 163, 184, 0.16);
      color: #cbd5e1;
    }

    .badge-hit { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .badge-be { background: rgba(59, 130, 246, 0.22); color: #60a5fa; }
    .badge-roi { background: rgba(245, 158, 11, 0.22); color: #fbbf24; }
    .badge-bias-strong { background: rgba(245, 158, 11, 0.22); color: #f59e0b; }
    .badge-bias-weak { background: rgba(148, 163, 184, 0.16); color: #94a3b8; }
    .badge-chaos { background: rgba(129, 140, 248, 0.2); color: #a5b4fc; }

    .scenario-box {
      background: rgba(30, 41, 59, 0.55);
      border-left: 3px solid var(--accent);
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 12px;
      margin-bottom: 10px;
      color: #e2e8f0;
    }

    .active-mods {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 5px;
    }

    .mod-tag {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 4px;
      background: rgba(56, 189, 248, 0.14);
      color: #7dd3fc;
    }

    .table-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11.5px;
      min-width: 560px;
    }

    th, td {
      padding: 6px 6px;
      text-align: left;
      border-bottom: 1px solid rgba(148, 163, 184, 0.12);
      vertical-align: middle;
    }

    th {
      background: rgba(30, 41, 59, 0.9);
      color: var(--muted);
      font-weight: 700;
      font-size: 10.5px;
      white-space: nowrap;
    }

    tr:last-child td { border-bottom: none; }

    .mark-cell {
      font-weight: 900;
      font-size: 13px;
      text-align: center;
      width: 30px;
    }

    .mark-◎ { color: #fb7185; }
    .mark-◯, .mark-○ { color: #38bdf8; }
    .mark-▲ { color: #34d399; }
    .mark-△ { color: #cbd5e1; }
    .mark-☆ { color: #fbbf24; }
    .mark-危, .mark-消 { color: #94a3b8; }

    .horse-name { font-weight: 700; color: var(--text); }
    .horse-role { font-size: 10px; color: var(--muted); display: block; }
    .sub-metric { font-size: 10px; color: var(--muted); line-height: 1.2; }
    .clamp-pill {
      display: inline-block;
      font-size: 9px;
      padding: 1px 4px;
      border-radius: 4px;
      background: rgba(244, 63, 94, 0.22);
      color: #fda4af;
      margin-left: 2px;
    }

    .tail-row td {
      background: rgba(15, 23, 42, 0.65);
      color: var(--muted);
      font-size: 11px;
    }

    .neon-panel {
      margin: 10px 0;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid var(--border);
      font-size: 12px;
    }

    .neon-rule-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 8px;
    }

    .neon-rule-grid > div {
      background: rgba(30, 41, 59, 0.6);
      padding: 6px 8px;
      border-radius: 8px;
    }

    .neon-rule-grid span {
      display: block;
      font-size: 10px;
      color: var(--muted);
    }

    .neon-rule-grid strong {
      font-size: 13px;
      color: var(--text);
    }

    .neon-conn-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
      margin-bottom: 8px;
    }

    .conn-chip {
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(99, 102, 241, 0.25);
      color: #c7d2fe;
      font-weight: 800;
      font-size: 11px;
    }

    .neon-audit-box {
      padding-top: 7px;
      border-top: 1px dashed rgba(148, 163, 184, 0.25);
    }

    .neon-audit-box p {
      margin: 4px 0 0;
      font-size: 11.5px;
      color: #cbd5e1;
    }

    .budget-control {
      background: rgba(30, 41, 59, 0.65);
      border-radius: 10px;
      padding: 10px 12px;
      margin: 10px 0;
    }

    .budget-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 12px;
      font-weight: 700;
    }

    .budget-val {
      font-size: 15px;
      font-weight: 900;
      color: var(--accent);
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .ticket-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
    }

    .ticket-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 12px;
    }

    .ticket-zone {
      font-size: 10px;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 4px;
      margin-right: 5px;
    }

    .zone-Core { background: rgba(16, 185, 129, 0.22); color: #34d399; }
    .zone-Alpha { background: rgba(245, 158, 11, 0.22); color: #fbbf24; }
    .zone-Hedge { background: rgba(168, 85, 247, 0.22); color: #c084fc; }

    .ticket-stake {
      text-align: right;
      white-space: nowrap;
    }

    .ticket-stake strong {
      font-size: 13px;
      color: var(--text);
      display: block;
    }

    .ticket-stake span {
      font-size: 10px;
      color: var(--muted);
    }

    .triggers-list {
      margin: 8px 0 0;
      padding-left: 16px;
      font-size: 11px;
      color: var(--muted);
    }

    .result-bar {
      margin-top: 8px;
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .result-hit { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.45); }
    .result-miss { background: rgba(148, 163, 184, 0.14); color: #cbd5e1; border: 1px solid var(--border); }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      width: 100%;
      max-width: 520px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
    }

    .modal h3 { margin: 0 0 8px; font-size: 15px; }

    .modal textarea {
      width: 100%;
      height: 180px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 10px;
    }

    .empty-state {
      text-align: center;
      padding: 36px 16px;
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-top">
      <div class="app-title">
        <span>🐎 Bayesian Keiba AI</span>
        <span class="neon-pill">NEON v7.0</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="btnImport">JSON読込</button>
        <button class="icon-btn" id="btnReload">↻ 更新</button>
      </div>
    </div>

    <div class="kpi-strip" id="kpiStrip">
      <div class="kpi-box"><span>対象日</span><strong id="kpiDate">-</strong></div>
      <div class="kpi-box"><span>勝負(S/A)</span><strong id="kpiTop">-</strong></div>
      <div class="kpi-box"><span>確定的中率</span><strong id="kpiHit">-</strong></div>
      <div class="kpi-box"><span>1万基準ROI</span><strong id="kpiRoi">-</strong></div>
    </div>

    <nav class="tab-bar">
      <button class="tab-btn active" data-tab="jra">JRA中央</button>
      <button class="tab-btn" data-tab="nar">地方NAR</button>
      <button class="tab-btn" data-tab="win5">WIN5</button>
      <button class="tab-btn" data-tab="stats">実績集計</button>
    </nav>
  </header>

  <main class="container" id="appRoot">
    <div class="empty-state">データを読み込んでいます...</div>
  </main>

  <div class="modal-backdrop" id="importModal">
    <div class="modal">
      <h3>JSONデータ手動インポート</h3>
      <p style="font-size:11px;color:var(--muted);margin:0 0 8px;">
        auto_predict.py が出力した latest.json または単体レースJSONを貼り付けてプレビューできます。
      </p>
      <textarea id="jsonInput" placeholder='{"date":"2026-11-22","races":[...]}'></textarea>
      <div class="modal-actions">
        <button class="icon-btn" id="btnCancelImport">閉じる</button>
        <button class="icon-btn" id="btnApplyImport" style="background:var(--accent);color:#0b1120;border-color:var(--accent);">反映する</button>
      </div>
    </div>
  </div>

  <script>
    // ===== 設定（リポジトリ構成に合わせて変更可能）=====
    const DATA_URL = './data/latest.json';
    const DEFAULT_BUDGET = 10000;
    const DEFAULT_WIN5_BUDGET = 10000;
    const DEFAULT_TRIPLE_BUDGET = 3000;

    let appState = {
      activeTab: 'jra',
      rankFilter: 'ALL',
      data: null,
      budgets: {},
      win5Budget: DEFAULT_WIN5_BUDGET,
      tripleBudget: DEFAULT_TRIPLE_BUDGET
    };

    // ===== サンプルフォールバック（data/latest.json 未配置時のプレビュー用）=====
    const SAMPLE_DATA = {
      date: '2026-11-22',
      updatedAt: '2026-11-22 14:25 JST',
      races: [
        {
          raceId: '20261122-tok-11',
          org: 'JRA',
          venue: '東京11R',
          name: '霜月ステークス(OP)',
          surfaceDist: 'ダ1400m',
          postTime: '15:25',
          skill: 'app-bayesian-horse-racing-text',
          strategyProfile: 'hit_rate_max',
          rank: 'A',
          pivotType: 'Dual-Pivot',
          nLead: 4,
          rpci: 48.2,
          wR: 0.35,
          m3: 54.6,
          intradayBiasConsistentR: 3,
          expectedRoi: 112.4,
          hitRate: 62.5,
          breakEvenRate: 51.8,
          scenario: '乾ダート標準・当日3R一致で外枠先行〜好位差し優位。S1平均持続45% / S2前崩れ差し35% / S3単騎20%',
          activeModules: ['2-Stage Benter融合', '3〜4歳ダート連勝昇級則', '3R一致バイアス同化'],
          horses: [
            { mark: '◎', role: '最安定Top-3軸', num: 12, name: 'サンプルエース', style: '先', f: 22.8, fFund: 24.5, q: 19.6, wUsed: 0.35, top2: 42.1, top3: 59.4, odds: 4.1, tags: ['F:東ダ1400好績', 'H:外枠大型+0.15'], comment: '外枠砂被り回避・持ち時計最上位' },
            { mark: '◯', role: '融合上位強制結線', num: 7, name: 'サンプルリバー', style: '差', f: 17.6, fFund: 18.2, q: 16.5, wUsed: 0.35, top2: 35.8, top3: 52.1, odds: 4.9, tags: ['F:上り3F最速', 'H:展開恩恵+0.12'], comment: 'ハイペース持続で安定して3着内' },
            { mark: '▲', role: '3連勝昇級Riser', num: 14, name: 'サンプルライザー', style: '差', f: 14.2, fFund: 16.4, q: 10.1, wUsed: 0.15, top2: 29.0, top3: 45.8, odds: 8.2, tags: ['F:3連勝昇級', 'H:Riser+0.14'], comment: '連勝中3歳・東京1400延長歓迎' },
            { mark: '☆', role: '中穴Value', num: 9, name: 'サンプルウィンド', style: '先', f: 9.8, fFund: 11.0, q: 6.2, wUsed: 0.10, top2: 21.5, top3: 34.0, odds: 13.5, tags: ['F:減量52kg', 'H:単一30%上限内'], comment: '軽斤量先行粘り込みに妙味' }
          ],
          tailSummary: { count: 12, sumF: 35.6, sumTop3: 108.7 },
          coreConnections: [[12, 7], [12, 14], [7, 14], [12, 9]],
          portfolioRules: { coreRatio: 0.76, dutchTargetReturn: 11800, singleLongshotCapPct: 0.30, maxLongshotAllocPct: 0.20 },
          counterfactualAudit: '◎出遅れ時は○7-▲14のCore結線で元返し防衛。消し内枠人気馬は単騎ハナ時のみ復活。',
          triggers: ['直前馬体重(+10kg以上Type II警戒)・ワイド実オッズ下限確認']
        }
      ],
      win5: null,
      tripleUmatan: null
    };

    function escapeHtml(str) {
      if (str == null) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function round100(val) {
      return Math.max(100, Math.round(val / 100) * 100);
    }

    function round50(val) {
      return Math.max(50, Math.round(val / 50) * 50);
    }

    function detectOrg(race) {
      if (race.org) return race.org.toUpperCase();
      if ((race.skill || '').includes('nar')) return 'NAR';
      const narVenues = ['大井', '川崎', '船橋', '浦和', '門別', '盛岡', '水沢', '金沢', '笠松', '名古屋', '園田', '姫路', '高知', '佐賀'];
      if (narVenues.some(v => (race.venue || '').includes(v))) return 'NAR';
      return 'JRA';
    }

    function normalizeRankBadge(race) {
      if (race.rank === 'New') {
        const sub = race.subRank || 'B';
        return { text: `新馬 ${sub}`, cls: sub === 'Pass' ? 'rank-Pass' : 'rank-New' };
      }
      const r = race.rank || 'B';
      return { text: r === 'Pass' ? '見送り' : `Rank ${r}`, cls: `rank-${r}` };
    }

    function renderNeonMetaBadges(race) {
      const badges = [];
      if (race.strategyProfile === 'hit_rate_max') {
        badges.push('<span class="badge badge-hit">🎯 的中率最大化</span>');
      } else if (race.strategyProfile) {
        badges.push(`<span class="badge">${escapeHtml(race.strategyProfile)}</span>`);
      }
      if (race.hitRate != null) {
        badges.push(`<span class="badge badge-hit">的中率 ${Number(race.hitRate).toFixed(1)}%</span>`);
      }
      if (race.breakEvenRate != null) {
        badges.push(`<span class="badge badge-be">元返し率 ${Number(race.breakEvenRate).toFixed(1)}%</span>`);
      }
      if (race.expectedRoi != null) {
        badges.push(`<span class="badge badge-roi">期待ROI ${Number(race.expectedRoi).toFixed(1)}%</span>`);
      }
      if (race.m3 != null) {
        badges.push(`<span class="badge">M3 ${Number(race.m3).toFixed(1)}%</span>`);
      }
      if (race.wR != null) {

        badges.push(`<span class="badge ${cls}">当日バイアス ${biasR}R一致</span>`);

    function buildScaledTickets(race, budget) {
      const isPass = race.rank === 'Pass' || race.subRank === 'Pass' || race.pivotType === 'Pass';
      if (isPass) return [];

      // 1) JSONにticketsがある場合は share 比率で動的スケーリング
      if (Array.isArray(race.tickets) && race.tickets.length > 0) {
        const scaled = race.tickets.map(t => {
          const pts = Math.max(1, Number(t.points || 1));
          const rawTotal = budget * Number(t.share || (1 / race.tickets.length));
          const unit = Math.max(100, Math.floor((rawTotal / pts) / 100) * 100);
          return {
            zone: t.zone || 'Core',
            type: t.type || 'ワイド',
            comb: t.comb || '-',
            points: pts,
            unit,
            total: unit * pts,
            odds: t.odds || '-',
            desc: t.desc || ''
          };
        });
        return adjustTotalToBudget(scaled, budget);
      }

      // 2) ticketsが無い場合は coreConnections + portfolioRules からDrop-Bufferedダッチング自動構成
      const rules = race.portfolioRules || { coreRatio: 0.75, dutchTargetReturn: 11800, singleLongshotCapPct: 0.30 };
      const horsesByNum = {};
      (race.horses || []).forEach(h => { horsesByNum[h.num] = h; });

      const conns = Array.isArray(race.coreConnections) && race.coreConnections.length > 0
        ? race.coreConnections
        : (() => {
            const top = (race.horses || []).filter(h => !['危', '消'].includes(h.mark)).slice(0, 4);
            if (top.length < 2) return [];
            const res = [];
            for (let i = 1; i < top.length; i++) res.push([top[0].num, top[i].num]);
            if (top.length >= 3) res.push([top[1].num, top[2].num]);
            return res;
          })();

      if (conns.length === 0) return [];

      const coreBudget = Math.round((budget * (rules.coreRatio || 0.75)) / 100) * 100;
      const alphaBudget = Math.max(0, budget - coreBudget);
      const targetReturn = ((rules.dutchTargetReturn || 11800) / 10000) * budget;
      const maxLongshotBudget = Math.floor(budget * (rules.singleLongshotCapPct || 0.30));

      const rawCore = conns.map(([a, b]) => {
        const ha = horsesByNum[a];
        const hb = horsesByNum[b];
        const estWideOdds = (ha && hb && ha.odds && hb.odds)
          ? Math.max(1.8, Math.round(Math.sqrt(Number(ha.odds) * Number(hb.odds)) * 0.62 * 10) / 10)
          : 4.5;
        const isLongshot = (ha && Number(ha.odds) >= 10) || (hb && Number(hb.odds) >= 10);
        const rawStake = targetReturn / estWideOdds;
        return { a, b, estWideOdds, isLongshot, rawStake };
      });

      const sumRaw = rawCore.reduce((s, x) => s + x.rawStake, 0) || 1;
      const tickets = rawCore.map(x => {
        let stake = round100((x.rawStake / sumRaw) * coreBudget);
        if (x.isLongshot) stake = Math.min(stake, maxLongshotBudget);
        return {
          zone: 'Core',
          type: 'ワイド',
          comb: `${x.a} - ${x.b}`,
          points: 1,
          unit: stake,
          total: stake,
          odds: `目安 ${x.estWideOdds.toFixed(1)}倍`,
          desc: `元返し目標 ¥${Math.round(stake * x.estWideOdds).toLocaleString()} (-15%時 ¥${Math.round(stake * x.estWideOdds * 0.85).toLocaleString()})`
        };
      });

      // Alpha / Win-Reach Hedge枠
      if (alphaBudget >= 200) {
        const hedges = Array.isArray(race.winReachHedge) ? race.winReachHedge : [];
        let remain = alphaBudget;
        if (hedges.length > 0 && remain >= 500) {
          const h = hedges[0];
          const hedgeStake = Math.min(remain, maxLongshotBudget, round100((h.hedge10k || 800) * (budget / 10000)));
          tickets.push({
            zone: 'Hedge',
            type: '単勝ヘッジ',
            comb: `${h.num} ${h.name || ''}`.trim(),
            points: 1,
            unit: hedgeStake,
            total: hedgeStake,
            odds: `${h.odds}倍`,
            desc: 'アタマ突き抜け元返し保証'
          });
          remain -= hedgeStake;
        }
        if (remain >= 100 && conns.length > 0) {
          const [a, b] = conns[0];
          tickets.push({
            zone: 'Alpha',
            type: '馬連',
            comb: `${a} - ${b}`,
            points: 1,
            unit: round100(remain),
            total: round100(remain),
            odds: '本線強化',
            desc: '◎-○ 連対上振れブースト'
          });
        }
      }

      return adjustTotalToBudget(tickets, budget);
    }

    function adjustTotalToBudget(tickets, budget) {
      if (!tickets.length) return tickets;
      const sum = tickets.reduce((s, t) => s + t.total, 0);
      const diff = budget - sum;
      if (diff !== 0) {
        const singlePt = tickets.find(t => t.points === 1) || tickets[0];
        if (singlePt.points === 1 && singlePt.total + diff >= 100) {
          singlePt.unit += diff;
          singlePt.total += diff;
        }
      }
      return tickets;
    }

      }

      const groups = { ALL: { n: 0, hit: 0, inv: 0, ret: 0 } };

    function updateHeaderKpi(data) {

      const topCnt = races.filter(r => ['S', 'A'].includes(r.rank) || (r.rank === 'New' && r.subRank === 'A')).length;
      document.getElementById('kpiTop').textContent = `${topCnt} / ${races.length}R`;

      const settled = races.filter(r => r.result && r.result.settled && r.rank !== 'Pass' && r.subRank !== 'Pass');
      if (settled.length) {
        const hits = settled.filter(r => Number(r.result.payout10k || 0) > 0).length;
        const ret = settled.reduce((s, r) => s + Number(r.result.payout10k || 0), 0);
        const inv = settled.length * 10000;
        document.getElementById('kpiHit').textContent = `${((hits / settled.length) * 100).toFixed(0)}%`;
        document.getElementById('kpiRoi').textContent = `${((ret / inv) * 100).toFixed(0)}%`;
      } else {
        document.getElementById('kpiHit').textContent = '-';
        document.getElementById('kpiRoi').textContent = '-';
      }
    }

        root.innerHTML = renderWin5Tab(data.win5);
        const wSlider = document.getElementById('win5Slider');
        if (wSlider) {
          wSlider.addEventListener('input', e => {
            appState.win5Budget = Number(e.target.value);
            render();
          });
        }
        return;
      }

      if (appState.activeTab === 'stats') {
        root.innerHTML = renderStatsTab(races);
        return;
      }

      const targetOrg = appState.activeTab === 'jra' ? 'JRA' : 'NAR';
      let filtered = races.filter(r => detectOrg(r) === targetOrg);

      if (appState.rankFilter === 'TOP') {
        filtered = filtered.filter(r => ['S', 'A'].includes(r.rank) || (r.rank === 'New' && r.subRank === 'A'));
      } else if (appState.rankFilter === 'BUY') {
        filtered = filtered.filter(r => r.rank !== 'Pass' && r.subRank !== 'Pass');
      }

      const filterBar = `
        <div class="filter-row">
          <div class="filter-chips">
            <button class="chip ${appState.rankFilter === 'ALL' ? 'active' : ''}" data-filter="ALL">全レース</button>
            <button class="chip ${appState.rankFilter === 'BUY' ? 'active' : ''}" data-filter="BUY">購入対象のみ</button>
            <button class="chip ${appState.rankFilter === 'TOP' ? 'active' : ''}" data-filter="TOP">勝負S/Aのみ</button>
          </div>
          <span style="font-size:11px;color:var(--muted);">${escapeHtml(data.updatedAt || '')}</span>
        </div>
      `;

      const tripleHtml = targetOrg === 'NAR' ? renderTripleUmatanBlock(data.tripleUmatan) : '';
      const cardsHtml = filtered.length
        ? filtered.map(renderRaceCard).join('')
        : '<div class="empty-state">該当するレースデータがありません。</div>';

      root.innerHTML = filterBar + tripleHtml + cardsHtml;

      root.querySelectorAll('[data-filter]').forEach(btn => {
        btn.addEventListener('click', () => {
          appState.rankFilter = btn.dataset.filter;
          render();
        });
      });

      root.querySelectorAll('[data-budget-slider]').forEach(slider => {
        slider.addEventListener('input', e => {
          const rid = e.target.dataset.budgetSlider;
          appState.budgets[rid] = Number(e.target.value);
          render();
        });
      });

      const tSlider = document.getElementById('tripleSlider');
      if (tSlider) {
        tSlider.addEventListener('input', e => {
          appState.tripleBudget = Number(e.target.value);
          render();
        });
      }
    }

    async function loadData() {
      try {
        const res = await fetch(`${DATA_URL}?t=${Date.now()}`, { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const json = await res.json();
        appState.data = Array.isArray(json) ? { date: '', races: json } : (json.races ? json : { date: '', races: [json] });
      } catch (err) {
        console.warn('Fallback to sample data:', err);
        appState.data = SAMPLE_DATA;
      }
      render();
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        appState.activeTab = btn.dataset.tab;
        render();
      });
    });

    document.getElementById('btnReload').addEventListener('click', loadData);

    const modal = document.getElementById('importModal');
    document.getElementById('btnImport').addEventListener('click', () => modal.classList.add('open'));
    document.getElementById('btnCancelImport').addEventListener('click', () => modal.classList.remove('open'));
    document.getElementById('btnApplyImport').addEventListener('click', () => {
      try {
        const parsed = JSON.parse(document.getElementById('jsonInput').value);
        appState.data = parsed.races ? parsed : { date: parsed.date || '', races: [parsed] };
        modal.classList.remove('open');
        render();
      } catch (e) {
        alert('JSONの構文エラーです: ' + e.message);
      }
    });

    loadData();
  </script>
</body>
</html>

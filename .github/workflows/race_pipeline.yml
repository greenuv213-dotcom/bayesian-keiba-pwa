name: JRA & NAR Bayesian Auto-Predictor

on:
  schedule:
    # 【JRA 土日】08:30 JST (金・土 23:30 UTC): JRA朝一括スクリーニング
    - cron: '30 23 * * 5,6'
    # 【JRA 土日】09:00〜16:30 JST: JRA 1時間前本予想
    - cron: '*/20 0-7 * * 6,0'
    # 【NAR 平日】12:30 JST: 南関4場・DG競走 昼スクリーニング
    - cron: '30 3 * * 1-5'
    # 【NAR 平日ナイター】14:00〜20:30 JST: 1時間前本予想＆トリプル馬単
    - cron: '*/30 5-11 * * 1-5'
    # 【結果照合】毎日 17:15 JST ＆ 21:15 JST
    - cron: '15 8,12 * * *'
  workflow_dispatch:

# 前の実行が終わっていない時は重複起動させない設定
concurrency:
  group: bayesian-keiba-pipeline
  cancel-in-progress: true

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -U google-genai requests beautifulsoup4
      - name: Run JRA & NAR Prediction Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FREE_API_KEY: ${{ secrets.GEMINI_FREE_API_KEY }}
          AI_PLAN: plan2_neon
        run: python scripts/auto_predict.py
      - name: Commit & Push Updated JSON to PWA
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git diff --staged --quiet || git commit -m "Auto-update JRA/NAR predictions (v11.7 JRA-Neon / NAR-Free)"
          git push

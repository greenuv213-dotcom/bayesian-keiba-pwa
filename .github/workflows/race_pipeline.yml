name: JRA Bayesian Auto-Predictor

on:
  schedule:
    # 土日の 08:30 JST (金曜・土曜 23:30 UTC): 朝一括スクリーニング
    - cron: '30 23 * * 5,6'
    # 土日の 09:00〜15:30 JST (00:00〜06:30 UTC): 20分おきに「発走1時間前レース」をチェック
    - cron: '*/20 0-6 * * 6,0'
    # 土日の 17:00 JST (08:00 UTC): 結果照合・回収率更新・スキル改訂パッチ生成
    - cron: '0 8 * * 6,0'
  workflow_dispatch: # iPhoneやPCから手動で即時実行したい時用

jobs:
  predict:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-genai requests beautifulsoup4
      - name: Run Prediction Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/auto_predict.py
      - name: Commit & Push Updated JSON to PWA
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git diff --staged --quiet || git commit -m "Auto-update predictions"
          git push

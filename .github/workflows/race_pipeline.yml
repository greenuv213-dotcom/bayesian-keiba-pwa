name: JRA & NAR Bayesian Auto-Predictor

on:
  schedule:
    # 【JRA 土日】08:30 JST (金・土 23:30 UTC): JRA朝一括スクリーニング
    - cron: '30 23 * * 5,6'
    # 【JRA 土日】09:00〜16:30 JST (00:00〜07:30 UTC): JRA 1時間前本予想（JRA完全優先ロック時間帯）
    - cron: '*/20 0-7 * * 6,0'
    # 【NAR 平日】12:30 JST (03:30 UTC): 南関4場・DG競走 昼スクリーニング
    - cron: '30 3 * * 1-5'
    # 【NAR 平日ナイター/後半】14:00〜20:30 JST (05:00〜11:30 UTC): 1時間前本予想＆トリプル馬単
    - cron: '*/30 5-11 * * 1-5'
    # 【結果照合】毎日 17:15 JST (08:15 UTC) ＆ 21:15 JST (12:15 UTC)
    - cron: '15 8,12 * * *'
  workflow_dispatch:

jobs:
  predict:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-genai requests beautifulsoup4
      - name: Run JRA & NAR Prediction Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/auto_predict.py
      - name: Commit & Push Updated JSON to PWA
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git diff --staged --quiet || git commit -m "Auto-update JRA/NAR predictions"
          git push
